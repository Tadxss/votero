openapi: 3.0.3
info:
  title: Votero Public API
  version: "1.0"
  description: >
    Create lobbies and read their results programmatically. See docs/API.md for a human-facing
    walkthrough with curl examples. Replace <project-ref> below with the hosted project's ref.
servers:
  - url: https://<project-ref>.supabase.co/functions/v1
security:
  - ApiKeyAuth: []
paths:
  /api-v1-me:
    get:
      summary: Confirm an API key is valid
      operationId: getMe
      responses:
        "200":
          description: Key is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  userId:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api-v1-create-lobby:
    post:
      summary: Create a lobby
      operationId: createLobby
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLobbyInput"
      responses:
        "200":
          description: Lobby created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLobbyResult"
        "400":
          description: >
            Validation error. In addition to field-constraint violations, can be one of
            AT_LEAST_ONE_QUESTION_REQUIRED, AT_LEAST_TWO_OPTIONS_REQUIRED (choice/ranked with <2
            options), INVALID_MAX_SELECTIONS, INAPPROPRIATE_CONTENT (profanity filter),
            CLOSES_AT_MUST_BE_FUTURE, or LOBBY_LIMIT_REACHED (10-lobby account cap) — see
            docs/API.md's Errors table for the full list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: >
            Too many requests — either this endpoint's own 20/hour bucket, or the stricter
            underlying 5-lobbies-per-10-minutes account limit (see docs/API.md's Rate limits).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api-v1-lobby-results:
    get:
      summary: Read a lobby's progress, tally, and (if applicable) ballot detail
      operationId: getLobbyResults
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: The lobby's human-readable join code, e.g. 7S8XDH6C
      responses:
        "200":
          description: Results for a lobby you created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >
            No lobby with that code owned by this key's account — deliberately indistinguishable
            from "code doesn't exist at all."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: "vk_live_<random>"
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, unrecognized, or revoked API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests in the current window
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthUnavailable:
      description: >
        The API key itself is valid, but minting a session for the account failed transiently
        (AUTH_UNAVAILABLE) — retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: INVALID_API_KEY
    CreateLobbyQuestionInput:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [choice, text, ranked]
          description: >
            choice: pick one, or up to N (see maxSelections). text: free-response, no options.
            ranked: rank every option in order (instant-runoff tallying).
        options:
          type: array
          minItems: 2
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: Required (min 2) for type choice/ranked; ignored for text.
        maxSelections:
          type: integer
          minimum: 1
          description: >
            choice-only, 1..options.length. Omit for classic single-select; set above 1 for
            "choose up to N." Not applicable to ranked — every option is always ranked.
    CreateLobbyInput:
      type: object
      required: [title, questions, voterCap, ballotMode, tallyVisibility]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        questions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateLobbyQuestionInput"
        voterCap:
          type: integer
          minimum: 1
          maximum: 10000
        ballotMode:
          type: string
          enum: [anonymous, open]
          description: >
            anonymous: nobody, including you, can see who voted for what — only aggregate
            tallies. open: you can see each voter's individual ballot via ballotDetail on the
            results endpoint.
        tallyVisibility:
          type: string
          enum: [live, hidden]
          description: >
            live: results visible while the lobby is open. hidden: results only visible once
            the lobby closes.
        closesAt:
          type: string
          format: date-time
          description: Optional ISO timestamp, must be in the future. Omit for no scheduled auto-close.
    Lobby:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        creatorId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [draft, open, closed]
        ballotMode:
          type: string
        tallyVisibility:
          type: string
        voterCap:
          type: integer
        joinedCount:
          type: integer
        votesCount:
          type: integer
        questionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    SurveyQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
        maxSelections:
          type: integer
          nullable: true
        position:
          type: integer
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              label:
                type: string
              position:
                type: integer
    CreateLobbyResult:
      type: object
      properties:
        lobby:
          $ref: "#/components/schemas/Lobby"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/SurveyQuestion"
    LobbyProgress:
      type: object
      properties:
        joined:
          type: integer
        cap:
          type: integer
        completedCount:
          type: integer
    QuestionTally:
      type: object
      description: Shape varies by question type (choice/text/ranked); see docs/API.md for examples.
    QuestionBallotDetail:
      type: object
      description: Only present for ballotMode "open" — names who voted for what.
    LobbyResults:
      type: object
      properties:
        progress:
          $ref: "#/components/schemas/LobbyProgress"
        tally:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/QuestionTally"
        ballotDetail:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/QuestionBallotDetail"
